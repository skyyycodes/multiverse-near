[workspace]
members = ["crates/*", "contracts/*"]
# Built on their own for wasm32-wasip2 (see oracle/fred-guest/README.md, oracle/nearusd-guest/README.md).
exclude = ["oracle/fred-guest", "oracle/nearusd-guest"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/skyyycodes/multiverse-near"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
