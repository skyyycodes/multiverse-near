[package]
name = "mock-ft"
version = "0.1.0"
description = "NEP-141 test token with an open, capped mint for the Multiverse Lending testnet demo"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "~5.14"
near-contract-standards = "~5.14"

[dev-dependencies]
near-sdk = { version = "~5.14", features = ["unit-testing"] }
