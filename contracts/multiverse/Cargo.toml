[package]
name = "multiverse-contract"
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Multiverse Lending on NEAR: conditional verse tokens, event oracle, pools, order book, money markets and the Root LP in one contract"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "~5.14"
multiverse-math = { path = "../../crates/multiverse-math" }

[dev-dependencies]
near-sdk = { version = "~5.14", features = ["unit-testing"] }
proptest = "1.11"
