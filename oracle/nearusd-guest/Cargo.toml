[package]
name = "nearusd-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
publish = false
description = "OutLayer guest that reports the NEAR/USD median of four public exchanges"

# Built on its own for wasm32-wasip2, so it is not part of the contract workspace.
[workspace]

[lib]
name = "nearusd_guest"
path = "src/lib.rs"

[[bin]]
name = "nearusd-guest"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
wasi = "0.13.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
